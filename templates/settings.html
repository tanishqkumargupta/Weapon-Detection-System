<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Weapon Detection System</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            color: #ffffff;
            display: flex;
            overflow-x: hidden;
        }
        .sidebar {
            width: 250px;
            background: #161b22;
            padding: 20px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }
        .sidebar a {
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            transition: background 0.3s;
            font-weight: bold;
            display: block;
            text-align: center;
        }
        .sidebar a:hover {
            background: #ff4d4d;
        }
        .main-content {
            margin-left: 270px;
            padding: 40px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .header {
            width: 100%;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            padding: 20px 0;
            background: linear-gradient(90deg, #ff4d4d, #ff1a1a);
            color: white;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(255, 77, 77, 0.6);
        }
        .logo {
            font-size: 40px;
            font-weight: bold;
            color: #ff4d4d;
            text-align: center;
            padding-bottom: 10px;
        }
        .settings-container {
            width: 80%;
            max-width: 600px;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(255, 77, 77, 0.6);
            text-align: left;
        }
        .settings-section {
            margin-bottom: 20px;
        }
        .settings-section h3 {
            color: #ff4d4d;
        }
        .settings-section label {
            display: block;
            margin: 10px 0 5px;
        }
        .settings-section input, .settings-section button {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: none;
            text-align: center;
        }
        .settings-section button {
            background: #ff4d4d;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .settings-section button:hover {
            background: #ff1a1a;
        }
        .settings-section input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
        .sidebar a:hover, .sidebar a.active-link {
            background: #ff4d4d;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">WDS</div>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('live_detection') }}">Live Detection</a>
        <a href="{{ url_for('detection_history') }}">Detection History</a>
        <a href="{{ url_for('security_alerts') }}">Security Alerts</a>
        <a href="{{ url_for('settings') }}">Account Settings</a>
    </div>
    
    <div class="main-content">
        <div class="header">Account Settings</div>
        
        <div class="settings-container">
            <div class="settings-section">
                <h3>Profile Information</h3>
                <label>Username</label>
                <input type="text" placeholder="Your Username">
                <label>Email</label>
                <input type="email" placeholder="Your Email">
                <button>Update Profile</button>
            </div>

            <div class="settings-section">
                <h3>Security</h3>
                <label>Old Password</label>
                <input type="password" placeholder="Old Password">
                <label>New Password</label>
                <input type="password" placeholder="New Password">
                <button>Change Password</button>
            </div>

            <div class="settings-section">
                <h3>Notifications</h3>
                <label><input type="checkbox"> Enable Security Alerts</label>
                <label><input type="checkbox"> Enable Detection Alerts</label>
                <button>Save Preferences</button>
            </div>

            <div class="settings-section">
                <h3>Account Actions</h3>
                <button style="background: #ff1a1a;">Delete Account</button>
                <button style="background: #444;">Logout</button>
            </div>
        </div>
    </div>
</body>
</html>
