<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/main.css') }}">

<title>Camera</title>

</head>

<body>

<div class="container">

<h2>

Camera Configuration

</h2>

<form method="POST">

    <label>
        <input type="radio"
               name="camera_type"
               value="webcam"
               checked>
        Webcam
    </label>

    <br><br>

    <label>
        <input type="radio"
               name="camera_type"
               value="ip">
        IP Camera
    </label>

    <br><br>

    <input
        type="text"
        name="camera_url"
        placeholder="http://192.168.x.x:8080/video">

    <br>

    <button type="submit">
        Start Detection
    </button>

</form>

<hr>

<h3>Live Detection</h3>

<img
    src="{{ url_for('video_feed') }}"
    width="100%"
    alt="Live Detection Feed">

</div>

</body>

</html>
