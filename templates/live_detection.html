<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Detection - Weapon Detection System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            color: #ffffff;
            display: flex;
            overflow-x: hidden;
        }
        .sidebar {
            width: 250px;
            background: #161b22;
            padding: 20px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }
        .sidebar a {
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            transition: background 0.3s;
            font-weight: bold;
            display: block;
            text-align: center;
        }
        .sidebar a:hover, .sidebar a.active-link {
            background: #ff4d4d;
        }
        .main-content {
            margin-left: 270px;
            padding: 40px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .header {
            width: 100%;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            padding: 20px 0;
            background: linear-gradient(90deg, #ff4d4d, #ff1a1a);
            color: white;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(255, 77, 77, 0.6);
        }
        .live-feed {
            width: 80%;
            max-width: 800px;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(255, 77, 77, 0.6);
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .live-video {
            width: 100%;
            border-radius: 8px;
            border: 2px solid #ff4d4d;
        }
        .detection-info {
            margin-top: 15px;
            font-size: 18px;
            color: #ffdddd;
        }
        .camera-selection {
            margin-top: 20px;
            text-align: center;
        }
        .camera-details {
            display: none;
            margin-top: 10px;
        }
        .logo {
            font-size: 40px;
            font-weight: bold;
            color: #ff4d4d;
            text-align: center;
            padding-bottom: 10px;
        }
        input[type="text"] {
            padding: 8px;
            border-radius: 6px;
            border: none;
            width: 300px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: linear-gradient(to right, #ff6b6b, #ff4757);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: linear-gradient(to right, #ff4757, #ff6b6b);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">WDS</div>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('live_detection') }}" class="active-link">Live Detection</a>
        <a href="{{ url_for('detection_history') }}">Detection History</a>
        <a href="{{ url_for('security_alerts') }}">Security Alerts</a>
        <a href="{{ url_for('settings') }}">Account Settings</a>
    </div>

    <div class="main-content">
        <div class="header">Weapon Detection System - Live Feed</div>

        <div class="camera-selection">
            <label for="camera-type">Select Camera Type:</label>
            <select id="camera-type">
                <option value="system" selected>System Camera</option>
                <option value="external">External Camera</option>
            </select>

            <div id="camera-url" class="camera-details">
                <label for="camera-url-input">External Camera URL:</label><br>
                <input type="text" id="camera-url-input" placeholder="http://<your-ip>:<port>" />
            </div>

            <button id="start-btn">Start Camera</button>
        </div>

        <div class="live-feed">
            <!-- ⛳ Default src empty -->
            <img id="live-video" src="" class="live-video" width="100%" />

            <div class="detection-info">
                Live Detection Status:
                <span style="color: #28a745; font-weight: bold;">Streaming</span>
            </div>
        </div>
    </div>

    <script>
        const cameraTypeSelect = document.getElementById("camera-type");
        const cameraUrlInputDiv = document.getElementById("camera-url");
        const cameraUrlInput = document.getElementById("camera-url-input");
        const startButton = document.getElementById("start-btn");
        const videoElement = document.getElementById("live-video");

        // Toggle URL input visibility
        cameraTypeSelect.addEventListener("change", () => {
            const selectedType = cameraTypeSelect.value;
            cameraUrlInputDiv.style.display = selectedType === "external" ? "block" : "none";
        });

        // Start button click handler
        startButton.addEventListener("click", () => {
            const cameraType = cameraTypeSelect.value;
            let feedUrl = `/setup-camera/video-feed?camera_type=${cameraType}`;

            if (cameraType === "external") {
                const cameraUrl = encodeURIComponent(cameraUrlInput.value.trim());
                if (!cameraUrl) {
                    alert("Please enter a valid external camera URL.");
                    return;
                }
                feedUrl += `&camera_url=${cameraUrl}`;
            }

            videoElement.src = feedUrl;
        });
    </script>
</body>
</html>
