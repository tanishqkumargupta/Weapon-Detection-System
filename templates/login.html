<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Weapon Detection System</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f, #3b3b58);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #252542;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 350px;
        }
        .login-container h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            background: #2a2a40;
            color: #ffffff;
            font-size: 16px;
        }
        .login-container input::placeholder {
            color: #d1d1e0;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-container button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.6);
        }
        .login-container p {
            margin-top: 15px;
            font-size: 14px;
        }
        .login-container a {
            color: #ff6b6b;
            text-decoration: none;
        }
        .login-container a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
    <script>
        function validateLogin(event) {
            event.preventDefault();
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let errorMessage = document.getElementById("error-message");

            if (email === "" || password === "") {
                errorMessage.textContent = "All fields must be filled out.";
                return;
            }
            window.location.href = "dashboard.html";
        }
    </script>
</head>
<body>
    <div class="login-container">
        <h1>Login to Your Account</h1>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <p id="error-message" class="error-message">
                {% for message in messages %}
                {{ message }}
                {% endfor %}
            </p>
            {% endif %}
            {% endwith %}
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="signup">Create an account</a></p>
    </div>
</body>
</html>
