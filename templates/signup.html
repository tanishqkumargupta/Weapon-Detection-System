<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/main.css') }}">

<title>Sign Up</title>

</head>

<body>

<h2>Create Account</h2>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<br><br>

<input
type="email"
name="email"
placeholder="Email"
required>

<br><br>

<input
type="password"
name="password"
placeholder="Password"
required>

<br><br>

<input
type="password"
name="confirmPassword"
placeholder="Confirm Password"
required>

<br><br>

<button type="submit">

Register

</button>

</form>

<p>

Already have an account?

<a href="/login">

Login

</a>

</p>

</body>

</html>
