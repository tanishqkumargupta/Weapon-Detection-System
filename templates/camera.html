<!DOCTYPE html>
<html>

<head>

<title>

Camera Setup

</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

padding:50px;

}

.container{

max-width:700px;

margin:auto;

background:white;

padding:30px;

border-radius:8px;

}

input{

width:100%;

padding:10px;

margin:10px 0;

}

button{

padding:12px 18px;

background:#2563eb;

color:white;

border:none;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h2>

Camera Configuration

</h2>

<form method="POST">

<label>

<input
type="radio"
name="camera_type"
value="webcam"
checked>

Webcam

</label>

<br><br>

<label>

<input
type="radio"
name="camera_type"
value="ip">

IP Camera

</label>

<br><br>

<input

type="text"

name="camera_url"

placeholder="http://192.168.x.x:8080/video">

<br>

<button>

Start Detection

</button>

</form>

</div>

</body>

</html>
