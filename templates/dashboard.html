<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/main.css') }}">

<title>Dashboard</title>

</head>

<body>

<div class="container">

<div class="card">

<h1>Weapon Detection Security System</h1>

<p>

Welcome,

<b>{{ username }}</b>

</p>

</div>

<div class="stat-grid">

<div class="stat-card">

<h3>Total Detections</h3>

<div class="stat-value">

{{ total }}

</div>

</div>

<div class="stat-card">

<h3>Last Threat</h3>

<div class="stat-value">

{{ latest_threat }}

</div>

</div>

<div class="stat-card">

<h3>Confidence</h3>

<div class="stat-value">

{{ latest_confidence }}%

</div>

</div>

</div>

<div class="card">

<div class="nav-buttons">

<a class="btn" href="{{ url_for('upload') }}">

Upload Detection

</a>

<a class="btn" href="{{ url_for('camera') }}">

Live Camera

</a>

<a class="btn" href="{{ url_for('history') }}">

Detection History

</a>

<a class="btn" href="{{ url_for('logout') }}">

Logout

</a>

</div>

</div>

</div>

</body>

</html>
